<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio JS</title>
    <link rel="stylesheet" href="./main.css">
</head>
<body>
    <div class="container">
        <h1>Escreva um número</h1>
        <p>Onde o campo B seja maior que o A</p>
        <form id="formulario">
            <input id="camp-a" type="number" placeholder="Campo A" required>
            <input id="camp-b" type="number" placeholder="Campo B" required>
            <button type="submit">ENVIAR</button>
        </form>
        <p id="mensagemFinal"></p>
    </div>
    <script src="./main.js"></script>
</body>
</html>
