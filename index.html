<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Médias</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./main.css">
</head>
<body>
    <header>
        <img src="./images/logo.png" alt="Capelo e diploma">
        <h1>Calculadora de médias</h1>
    </header>
    <form>
        <input type="text" placeholder="Nome da Atividade" required>
        <input type="number" placeholder="Nota da Atividade" min="0" max="10">
        <button type="submit">Adicionar +</button>
    </form>
    <table>
        <thead>
            <tr>
                <th>Nome da Atividade</th>
                <th>Nota da Atividade</th>
                <th>Aprovado?</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Atividade 1</td>
                <td>7</td>
                <td><img src="./images/aprovado.png" alt="emoji festejando"></td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>média final</td>
                <td>7</td>
                <td>aprovado</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
